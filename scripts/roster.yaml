# Model roster for the /cybersecurity ensemble.
#
# mode: "cli" (subscription-authenticated, cheap) or "api" (pay-per-token).
#
# Prompt delivery (see run_cli in orchestrate.py) is chosen by the token in `cmd`,
# and every entry runs with shell=False as an argv list (no shell interpretation):
#   * no token        -> prompt piped on stdin        (claude -p, codex-fugu exec)
#   * {prompt_file}   -> prompt written to a temp file, path substituted (grok --prompt-file)
#   * {prompt}        -> prompt inline as ONE argv element, max 100,000 bytes (kimi -p,
#                        agy -p)
# Inline delivery is bounded because a single argument is capped at 128 KiB on
# Linux (MAX_ARG_STRLEN); oversize prompts raise a clear error — switch that
# worker to api mode for large targets. For api mode the OpenAI-compatible HTTP
# path is used with base_url (https only) + api_key_env.
#
# Per-model tuning (both optional, both on workers):
#   * max_chars -> how much of the target THIS model is shown. Big-context / stdin/file
#     models can read more; an inline (-p) model must stay under ~100 KB (see above).
#     Falls back to defaults.max_target_chars (or 180,000) when unset.
#   * weight    -> how much this model's vote counts toward weighted agreement (a
#     stronger model can outweigh a weaker one). Defaults to 1.0. Tune to taste.
#
# BRING YOUR OWN ACCESS: every cli entry authenticates against YOUR logged-in CLI;
# every api entry uses YOUR own key from the named env var. No credentials live in
# this file. If you don't have a given model, delete it from `defaults.workers` —
# the ensemble degrades gracefully to whatever you actually have.
#
# ---------------------------------------------------------------------------
# Roster refreshed 2026-07-27. Every invocation below was smoke-tested on this
# machine that day (claude, codex-fugu, grok, agy, kimi all answered a live
# single-turn prompt).
#
# NOT in this roster, deliberately:
#   * GPT-5.6 Sol / Terra (Codex) — the ChatGPT allowance is exhausted. The OpenAI
#     seat is gone, not merely rate-limited, so the slot is filled by fugu-ultra
#     below until GPT access returns.
#   * Claude Fable 5 — Anthropic's own guidance excludes security analysis from its
#     bug-finding gains, and its safety classifiers can DECLINE cyber-adjacent
#     prompts while still returning a successful, empty response. A silently empty
#     worker is the one failure mode a security ensemble must not have.
# ---------------------------------------------------------------------------

organizers:
  opus:
    mode: cli
    model: claude-opus-5
    cmd: 'claude -p --model claude-opus-5 --effort high'   # prompt on stdin
    # api fallback: mode: api, base_url https://api.anthropic.com, ANTHROPIC_API_KEY

  fugu:
    mode: cli                # Codex CLI binary installed as `codex-fugu` (provider: sakana)
    model: fugu-ultra-v1.1
    cmd: 'codex-fugu exec --skip-git-repo-check --color never -m fugu-ultra-v1.1 -c model_reasoning_effort=xhigh'
    # stdin delivery. --skip-git-repo-check is REQUIRED when the cwd isn't a git repo.

  grok:
    mode: cli                # logged in via grok.com — no API key needed
    model: grok-4.5
    cmd: 'grok -m grok-4.5 --effort high --output-format plain --prompt-file {prompt_file}'
    # api fallback: mode: api, base_url https://api.x.ai/v1, api_key_env XAI_API_KEY

workers:
  opus:
    mode: cli
    model: claude-opus-5
    effort: high             # bump to xhigh for a high-stakes review (cost/latency lever)
    max_chars: 200000        # stdin delivery — large context OK
    weight: 1.3              # highest-precision reviewer; also the preferred verifier
    cmd: 'claude -p --model claude-opus-5 --effort high'
    # api fallback: mode: api, base_url https://api.anthropic.com, ANTHROPIC_API_KEY

  sonnet:
    mode: cli
    model: claude-sonnet-5
    effort: high
    max_chars: 200000        # stdin delivery — large context OK
    weight: 1.0
    cmd: 'claude -p --model claude-sonnet-5 --effort high'
    # api fallback: mode: api, base_url https://api.anthropic.com, ANTHROPIC_API_KEY

  fugu:
    mode: cli                # stand-in for the GPT slot while the ChatGPT allowance is out
    model: fugu-ultra-v1.1
    effort: xhigh
    max_chars: 200000        # stdin delivery — large context OK
    weight: 1.1
    cmd: 'codex-fugu exec --skip-git-repo-check --color never -m fugu-ultra-v1.1 -c model_reasoning_effort=xhigh'
    # Heavy: a trivial prompt still burned ~27K tokens at xhigh. Drop to `high` if
    # runs get slow. Prints a session preamble before the answer — parse_findings
    # recovers the JSON array out of surrounding prose, so that is harmless.

  grok:
    mode: cli                # logged in via grok.com — no API key needed
    model: grok-4.5
    effort: high
    max_chars: 200000        # temp-file delivery — no arg-size limit
    weight: 1.0
    cmd: 'grok -m grok-4.5 --effort high --output-format plain --prompt-file {prompt_file}'
    # api fallback: mode: api, base_url https://api.x.ai/v1, api_key_env XAI_API_KEY

  # DISABLED 2026-07-27 — kept for reference, deliberately NOT in defaults.workers.
  # Gemini via AGY REFUSES this skill's core task. Both tiers were asked to review a
  # 6-line SQL-injection/command-injection sample, once through the real ensemble
  # prompt and once with an explicit authorized-blue-team framing:
  #   gemini-3.6-flash-high -> "Sorry, I cannot fulfill your request to analyze this
  #                             code snippet for vulnerabilities."
  #   gemini-3.1-pro-high   -> "I am unable to perform vulnerability analysis or
  #                             security audits on specific code snippets."
  # It is a provider policy decision, not a wiring bug — the CLI, login, model
  # pinning and prompt delivery all work (verified the same day with a non-security
  # prompt). Re-enable only if that policy changes, or wire the Gemini/Vertex API
  # directly and re-test with a real finding first. Do NOT try to reword the prompt
  # to slip past the refusal.
  gemini:
    mode: cli                # Antigravity (AGY) CLI — uses your Google login
    model: gemini-3.6-flash-high
    effort: high             # the tier is baked into the model name (-high/-medium/-low)
    max_chars: 80000         # inline (-p) delivery — MUST stay under the 100 KB arg limit
    weight: 0.8
    cmd: 'agy --model gemini-3.6-flash-high --print-timeout 15m -p {prompt}'
    # --model in print mode was broken on 2026-07-24 but is FIXED as of 2026-07-27.
    # Do NOT add a separate --effort flag. The standalone `gemini` CLI still rejects
    # this machine's subscription login (Google IneligibleTierError).
    # api fallback: mode: api, Gemini/Vertex endpoint, GEMINI_API_KEY

  kimi:
    mode: cli                # OAuth-logged-in kimi-code CLI — no API key needed
    model: kimi-code/k3-max  # K3 pinned to MAX thinking (see note below)
    effort: max
    max_chars: 80000         # inline (-p) delivery — MUST stay under the 100 KB arg limit
    weight: 0.9              # verbose; independent family, so valuable as a cross-check
    cmd: 'kimi -m kimi-code/k3-max -p {prompt}'
    # The Kimi CLI has NO per-call effort flag — max effort must come from config.
    # `kimi-code/k3-max` is a local alias in ~/.kimi-code/config.toml: same k3 model
    # and 1M context as `kimi-code/k3`, but default_effort = "max". Add it there
    # (copy the [models."kimi-code/k3"] block, rename, set default_effort = "max")
    # or this entry will fail with an unknown-model error. `kimi doctor` validates.
    # inline is capped at 100,000 bytes — for larger targets use the api fallback:
    # mode: api, base_url https://platform.moonshot.ai/v1, api_key_env MOONSHOT_API_KEY

defaults:
  organizer: opus
  # `gemini` is intentionally absent — it refuses security review (see its entry above).
  workers: [opus, sonnet, fugu, grok, kimi]
  # cheaper default subset for routine reviews: three families, two of them
  # (grok.com, Moonshot) billed outside the Anthropic allowance.
  quick_workers: [sonnet, grok, kimi]
  concurrency: 5
  timeout_seconds: 900       # max-effort workers are slow; 600s was cutting them off
  max_target_chars: 180000   # default per-model cap when a worker sets no max_chars
                             # (also overridable at runtime with --max-chars)
